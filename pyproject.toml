[project]
name = "discoanalytica"
version = "0.1.0"
description = "A collaborative music analysis project exploring lyrical sentiment, genre trends, and societal correlations."
readme = "README.md"
authors = [
    { name = "Katheryn M. Shechet", email = "ktmtta@gmail.com" },
    { name = "Patrick R Shechet", email = "patrick.shechet@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.2.0",
    "platformdirs>=4.3.6",
    "pyyaml>=6.0.2",
]

[project.scripts]
disco = "discoanalytica:main"
disco_hash = "discoanalytica.utility.file_hash:main"

[project.optional-dependencies]
s3 = [
    "boto3>=1.37.4",
]
kaggle = [
    "kagglehub>=0.3.10",
]
http = [
    "httpx>=0.28.1",
    "tqdm>=4.67.1",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/discoanalytica"]
include = [
    "discoanalytica/data_definition/data_definitions/*.yaml",
    "discoanalytica/sql/*.sql"
]
